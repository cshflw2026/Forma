<script>
/* ---- spremanje (localStorage u try/catch; aplikacija radi i bez njega) ---- */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const K='forma1:',$=s=>document.querySelector(s);
let cur,D,tab='trening',draft=null;
const load=p=>{try{return JSON.parse(LS.get(K+p))||null}catch(e){return null}};
const save=()=>{D.ts=Date.now();LS.set(K+cur,JSON.stringify(D));rsQ()};
let RS=null,rq=null;
const rsP=()=>'data/users/'+RS.id+'/forma-'+cur;
async function rsInit(){try{if(typeof claude==='undefined'||!claude.use)return;const[u,db]=await Promise.all([claude.use('user'),claude.use('db')]);if(!u||!db)return;const id=await u.id();if(!id)return;RS={db,id};await rsPull()}catch(e){}}
async function rsPull(){if(!RS)return;try{const s=await RS.db.doc(rsP()).get();if(s.exists){const r=s.data();if(!D||(r.ts||0)>(D.ts||0)){D=JSON.parse(r.j);LS.set(K+cur,r.j);draft=null;render()}else if((D.ts||0)>(r.ts||0))rsPush()}else if(D)rsPush()}catch(e){}}
function rsPush(){if(!RS||!D)return;try{const j=JSON.stringify(D);if(j.length>240000)return;RS.db.doc(rsP()).set({j,ts:D.ts||0}).catch(()=>{})}catch(e){}}
function rsQ(){if(!RS)return;clearTimeout(rq);rq=setTimeout(rsPush,1500)}

const num=v=>parseFloat(String(v).replace(',','.'));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---- kalkulator (Mifflin-St Jeor) ---- */
function calc(p,cm,kg,age,adj){
  const m=p==='on',bmr=10*kg+6.25*cm-5*age+(m?5:-161),tdee=bmr*(m?1.5:1.55);
  let k=(m?tdee+300:tdee-400)+(adj||0),kcal=Math.round(k/10)*10;
  if(!m){const fl=Math.max(1200,bmr);if(kcal<fl)kcal=Math.ceil(fl/10)*10}
  const prot=Math.round((m?1.8:2)*kg/5)*5,fat=Math.max(.8*kg,.25*kcal/9),carb=Math.max(0,(kcal-4*prot-9*fat)/4);
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat:Math.round(fat),carb:Math.round(carb)};
}
const targets=d=>calc(cur,D.cm,D.kg,D.age,(D.adj||0)+(d&&D.addTrain?trainDay(d):0));
const weekNo=()=>Math.max(1,Math.floor((new Date(today())-new Date(D.start))/6048e5)+1);

/* ---- ikone i prsten ---- */
const IC={trening:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',prehrana:'<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 2-3 5-3 8h3v10"/>',napredak:'<path d="M3 20h18M5 16l4-5 4 3 6-8"/>',profil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const NAMES={trening:'Trening',prehrana:'Prehrana',napredak:'Napredak',profil:'Profil'};
function ring(c,t){const r=52,L=2*Math.PI*r,f=Math.min(1,t?c/t:0);
 return `<svg viewBox="0 0 120 120" width="136" height="136" role="img" aria-label="Kalorije"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--s2)" stroke-width="10"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--ac)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${f*L} ${L}" transform="rotate(-90 60 60)"/></svg>`}
function macro(n,c,t){return `<div><div class="row"><span>${n}</span><span class="mu">${Math.round(c)} / ${t} g</span></div><div class="bar"><i style="width:${Math.min(100,t?c/t*100:0)}%"></i></div></div>`}

/* ---- prikazi ---- */
function onboarding(edit){
  const d=draft||(edit?{p:cur,cm:D.cm,kg:D.kg,age:D.age,start:D.start}:{p:cur,cm:'',kg:'',age:'',start:today()});
  draft=d;
  return `<h1>${edit?'Podaci':'Dobro došli'}</h1><p class="mu">${edit?'Promjena podataka preračunava ciljeve.':'Odaberite profil i unesite podatke. Izračunat ćemo dnevne ciljeve.'}</p>
  ${edit?'':`<div class="seg" role="group" aria-label="Profil"><button class="${d.p==='on'?'on':''}" onclick="pick('on')">On</button><button class="${d.p==='ona'?'on':''}" onclick="pick('ona')">Ona</button></div>`}
  <div class="card g g3"><div><label for="cm">Visina (cm)</label><input id="cm" type="text" inputmode="decimal" value="${d.cm}" oninput="pv()"></div><div><label for="kg">Težina (kg)</label><input id="kg" type="text" inputmode="decimal" value="${d.kg}" oninput="pv()"></div><div><label for="age">Godine</label><input id="age" type="text" inputmode="numeric" value="${d.age}" oninput="pv()"></div></div>

 (L?'<div class="card" style="margin-top:14px"><span class="badge" style="background:var(--s2)">Lagani tjedan</span><p>Iste vježbe i serije, oko 60% tereta, bez dolaska do otkaza.</p></div>':'')+
 `<div class="prow"><span>${n} od ${N} ${pl(N,'vježbe','vježbe','vježbi')} gotovo</span><span class="mu">${pc}%</span></div><div class="bar thick"><i style="width:${pc}%"></i></div>`+
 (P.note?`<div class="card mu" style="margin-top:14px">${P.note}</div>`:'')+`<div class="card" style="margin-top:14px"><b>${d.wu.a}</b><p>${d.wu.b}</p></div>`;
 d.x.forEach((x,j)=>{const k=i+'-'+j,o=!!c[k],a=ALT[x.e],dr=(D.dr||{})[k]||{},ts=/sekund/.test(x.s),ls=logs(x.e).slice(-1)[0],ad=advice(x);
  if(o){s+=`<button class="xd" onclick="tgl('${k}')" aria-label="Poništi: ${x.h}"><span class="ck">${CHK}</span><span><b>${x.h}</b><span class="db">${dr.k&&dr.r?dr.k+' kg × '+dr.r:x.s}</span></span></button>`;return}
  s+=`<div class="xc${j===ai?' cur':''}"><div class="hrn">${x.h}</div><div class="enn">${x.e}</div><div class="srr">${x.s} · ${lab} ${x.p}</div>${x.z?`<p>Radi: ${x.z}</p>`:''}<p>${x.n}</p>${x.k?`<p>Početni teret: ${L?lk(x.k)+' (≈60%)':x.k}</p>`:'<p class="mu">Odaberi težinu uz koju ostaju 3 ponavljanja u rezervi.</p>'}`+
  (ts?'':`<p class="mu">${ls?'Zadnji put: '+ls.kg+' kg × '+ls.r:'Zadnji put: još nema unosa'}</p>${ad?'<p><b>'+ad+'</b></p>':''}<div class="g g2" style="margin-top:8px"><div><label for="k${k}">kg</label><input id="k${k}" type="text" inputmode="decimal" value="${dr.k||''}" oninput="lg('${k}','k',this.value)"></div><div><label for="r${k}">Ponavljanja</label><input id="r${k}" type="text" inputmode="numeric" value="${dr.r||''}" oninput="lg('${k}','r',this.value)"></div></div>`)+
  `<div class="two"><button class="dk" onclick="startT('${x.p}')">Pokreni pauzu</button><button class="chk" role="checkbox" aria-checked="false" aria-label="Gotovo: ${x.h}" onclick="tgl('${k}')">Gotovo</button></div><div class="lr"><a class="u" href="${yt(x.e)}" target="_blank" rel="noopener">▶ Pogledaj kako se radi</a></div>`+
  (a?`<details><summary>Zauzeta sprava? Zamjena</summary><div class="hrn" style="font-size:18px">${a[0]}</div><div class="enn">${a[1]}</div><p></p><a class="u" href="${yt(a[1])}" target="_blank" rel="noopener">▶ Pogledaj kako se radi</a></details>`:'')+`</div>`});
 if(d.c)s+=`<div class="card"><b>${d.c.a}</b><p>${d.c.b}</p></div>`;
 return s+`<button style="margin-top:8px" onclick="fin(${i})">Završi trening</button><p></p>`}

function vProfil(){const T=targets();
 return `<h1>Profil</h1><div class="seg" role="group" aria-label="Profil"><button class="${cur==='on'?'on':''}" onclick="switchP('on')">On</button><button class="${cur==='ona'?'on':''}" onclick="switchP('ona')">Ona</button></div>
 <div class="card g g3"><div><div class="lab">Visina</div><b>${D.cm} cm</b></div><div><div class="lab">Težina</div><b>${D.kg} kg</b></div><div><div class="lab">Godine</div><b>${D.age}</b></div></div>
 <button class="sec" onclick="draft=null;tab='uredi';render()">Uredi podatke</button>
 <h2>Ciljevi</h2><div class="card"><div class="g g2"><div><div class="lab">BMR</div><div class="big" style="font-size:28px">${T.bmr}</div></div><div><div class="lab">TDEE</div><div class="big" style="font-size:28px">${T.tdee}</div></div></div>
 <div class="lab" style="margin-top:16px">Dnevni cilj</div><div class="big">${T.kcal} kcal</div><div class="lab">Proteini ${T.prot} g · Ugljikohidrati ${T.carb} g · Masti ${T.fat} g</div>
 ${D.adj?`<p class="mu">Uključena je korekcija prema trendu težine: ${D.adj>0?'+':'−'}${Math.abs(D.adj)} kcal.</p><button class="sec" onclick="wUndo()">Ukloni korekciju</button>`:''}<p class="mu">Potrošnja treninga već je uključena u TDEE.</p></div>
 <div class="card sw"><div><b>Dodaj potrošnju treninga na cilj</b><p class="mu">Zadano isključeno: TDEE već uračunava treninge pa bi se potrošnja brojala dvaput.</p></div><button class="tog ${D.addTrain?'on':''}" role="switch" aria-checked="${!!D.addTrain}" aria-label="Dodaj potrošnju treninga na cilj" onclick="D.addTrain=!D.addTrain;save();render()"><span></span></button></div>
 ${bkHtml()}
 <h2>O podacima</h2><p class="mu">Podaci o proizvodima: Open Food Facts (ODbL), snimka od 9.11.2026. <a href="https://openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a></p>`}

function switchP(p){if(p===cur)return;cur=p;tv=null;wf={k:'',d:''};bk={msg:'',pend:null,txt:''};LS.set(K+'last',p);D=load(p);tab='profil';draft=null;if(!D)draft={p,cm:'',kg:'',age:'',start:today()};render();rsPull()}
function render(){render0();hSync()}
function render0(){if(!(fd&&fd.step==='bc'))stopScan();document.body.dataset.p=(!D&&draft)?draft.p:cur;const m=$('#m'),n=$('#nav');
 if(!D){n.hidden=true;m.innerHTML=onboarding(false);pv();return}
 if(tab==='uredi'){n.hidden=true;m.innerHTML=onboarding(true);pv();window.scrollTo(0,0);return}
 n.hidden=false;n.innerHTML=Object.keys(NAMES).map(k=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render();window.scrollTo(0,0)" aria-label="${NAMES[k]}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${NAMES[k]}</button>`).join('');
 m.innerHTML={trening:vTrening,prehrana:vPrehrana,napredak:vNapredak,profil:vProfil}[tab]()}
function init(){const h=location.hash.slice(1);cur=(h==='on'||h==='ona')?h:(LS.get(K+'last')==='ona'?'ona':'on');LS.set(K+'last',cur);D=load(cur);draft=null;if(!D)draft={p:cur,cm:'',kg:'',age:'',start:today()};render()}
/* sistemska tipka natrag: jedan korak unutar aplikacije umjesto izlaska iz stranice */
let hd=0,hskip=0,hpop=false,hpush=0;
const hdepth=()=>D?(fd?1:0)+(tab==='trening'&&tv!==null?1:0)+(tab==='uredi'?1:0):0;
function hPush(){try{history.pushState({f:1},'');hpush++}catch(e){}}
function hSync(){const d=hdepth();if(d>hd)hPush();else if(d===0&&hd>0&&!hpop&&hpush>0){hskip=1;try{history.back()}catch(e){hskip=0}}hd=d;hpop=false}
function hBack(){if(fd)backF();else if(tab==='uredi'){draft=null;tab='profil';render()}else if(tv!==null){tv=null;stopT();render()}}
addEventListener('popstate',()=>{hpush=Math.max(0,hpush-1);if(hskip){hskip=0;return}if(hdepth()>0){hpop=true;hBack();hpop=false;if(hdepth()>0)hPush()}});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if((h==='on'||h==='ona')&&h!==cur)switchP(h)});
init();rsInit();aiInit();offStep();
if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
