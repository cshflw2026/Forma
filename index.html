<script>
/* ---- spremanje (localStorage u try/catch; aplikacija radi i bez njega) ---- */
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const K='forma1:',$=s=>document.querySelector(s);
let cur,D,tab='trening',draft=null;
const load=p=>{try{return JSON.parse(LS.get(K+p))||null}catch(e){return null}};
const save=()=>{D.ts=Date.now();LS.set(K+cur,JSON.stringify(D));rsQ()};
let RS=null,rq=null;
const rsP=()=>'data/users/'+RS.id+'/forma-'+cur;
async function rsInit(){try{if(typeof claude==='undefined'||!claude.use)return;const[u,db]=await Promise.all([claude.use('user'),claude.use('db')]);if(!u||!db)return;const id=await u.id();if(!id)return;RS={db,id};await rsPull()}catch(e){}}
async function rsPull(){if(!RS)return;try{const s=await RS.db.doc(rsP()).get();if(s.exists){const r=s.data();if(!D||(r.ts||0)>(D.ts||0)){D=JSON.parse(r.j);LS.set(K+cur,r.j);draft=null;render()}else if((D.ts||0)>(r.ts||0))rsPush()}else if(D)rsPush()}catch(e){}}
function rsPush(){if(!RS||!D)return;try{const j=JSON.stringify(D);if(j.length>240000)return;RS.db.doc(rsP()).set({j,ts:D.ts||0}).catch(()=>{})}catch(e){}}
function rsQ(){if(!RS)return;clearTimeout(rq);rq=setTimeout(rsPush,1500)}

const num=v=>parseFloat(String(v).replace(',','.'));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---- kalkulator (Mifflin-St Jeor) ---- */
function calc(p,cm,kg,age,adj){
  const m=p==='on',bmr=10*kg+6.25*cm-5*age+(m?5:-161),tdee=bmr*(m?1.5:1.55);
  let k=(m?tdee+300:tdee-400)+(adj||0),kcal=Math.round(k/10)*10;
  if(!m){const fl=Math.max(1200,bmr);if(kcal<fl)kcal=Math.ceil(fl/10)*10}
  const prot=Math.round((m?1.8:2)*kg/5)*5,fat=Math.max(.8*kg,.25*kcal/9),carb=Math.max(0,(kcal-4*prot-9*fat)/4);
  return{bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,prot,fat:Math.round(fat),carb:Math.round(carb)};
}
const targets=d=>calc(cur,D.cm,D.kg,D.age,(D.adj||0)+(d&&D.addTrain?trainDay(d):0));
const weekNo=()=>Math.max(1,Math.floor((new Date(today())-new Date(D.start))/6048e5)+1);

/* ---- ikone i prsten ---- */
const IC={trening:'<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',prehrana:'<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10M17 3c-2 2-3 5-3 8h3v10"/>',napredak:'<path d="M3 20h18M5 16l4-5 4 3 6-8"/>',profil:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'};
const NAMES={trening:'Trening',prehrana:'Prehrana',napredak:'Napredak',profil:'Profil'};
/* ---- prezentacijski pomoćnici (animacije; bez utjecaja na logiku) ---- */
let lastView=null,ckSeen={d:null,s:{}};const BV={},RM=matchMedia('(prefers-reduced-motion: reduce)');
const bwp=(k,w)=>{const p=BV[k]===undefined?0:BV[k];BV[k]=w;return p};
function ring(c,t){const r=52,L=2*Math.PI*r,f=Math.min(1,t?c/t:0),p=bwp('ring',f);
  return `<svg class="rg" viewBox="0 0 120 120" width="128" height="128" role="img" aria-label="Kalorije"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--s3)" stroke-width="8"/><circle class="rgv" data-d="${f*L} ${L}" data-o="${f?1:0}" cx="60" cy="60" r="${r}" fill="none" stroke="var(--ac)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${p*L} ${L}" style="opacity:${p?1:0}" transform="rotate(-90 60 60)"/></svg>`}
function macro(n,c,t){const w=Math.min(100,t?c/t*100:0),p=bwp('m'+tab+n,w);return `<div><div class="row"><span>${n}</span><span class="mu">${Math.round(c)} / ${t} g</span></div><div class="bar"><i data-w="${w}" style="width:${p}%"></i></div></div>`}
const snapOne=e=>e.classList.contains('seg')?[...e.children].findIndex(b=>b.classList.contains('on')):e.classList.contains('on');
const setUi=(e,v)=>{if(e.classList.contains('seg'))[...e.children].forEach((b,i)=>b.classList.toggle('on',i===v));else e.classList.toggle('on',v)};
function cntUp(e){const to=+e.dataset.n;if(RM.matches||!(to>0))return;const t0=performance.now();(function f(t){if(!e.isConnected)return;const p=Math.min(1,(t-t0)/600);e.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(t0)}
function settle(m,en,sn){const U=[...m.querySelectorAll('.seg,.tog')],ch=[];
  U.forEach((e,i)=>{const v=snapOne(e);if(!en&&sn[i]!==undefined&&sn[i]!==v&&typeof sn[i]===typeof v){setUi(e,sn[i]);ch.push([e,v])}});
  if(en)[...m.children].slice(0,10).forEach((c,i)=>c.style.setProperty('--i',i));
  void m.offsetWidth;
  ch.forEach(o=>setUi(o[0],o[1]));
  m.querySelectorAll('[data-w]').forEach(e=>{e.style.width=e.dataset.w+'%'});
  m.querySelectorAll('.rgv').forEach(e=>{e.style.strokeDasharray=e.dataset.d;e.style.opacity=e.dataset.o});
  if(en)m.querySelectorAll('.cnt').forEach(cntUp)}

/* ---- prikazi ---- */
function onboarding(edit){
  const d=draft||(edit?{p:cur,cm:D.cm,kg:D.kg,age:D.age,start:D.start}:{p:cur,cm:'',kg:'',age:'',start:today()});
  draft=d;
  return `<h1>${edit?'Podaci':'Dobro došli'}</h1><p class="mu">${edit?'Promjena podataka preračunava ciljeve.':'Odaberite profil i unesite podatke. Izračunat ćemo dnevne ciljeve.'}</p>
  ${edit?'':`<div class="seg" role="group" aria-label="Profil"><button class="${d.p==='on'?'on':''}" onclick="pick('on')">On</button><button class="${d.p==='ona'?'on':''}" onclick="pick('ona')">Ona</button></div>`}
  <div class="card g g3"><div><label for="cm">Visina (cm)</label><input id="cm" type="text" inputmode="decimal" value="${d.cm}" oninput="pv()"></div><div><label for="kg">Težina (kg)</label><input id="kg" type="text" inputmode="decimal" value="${d.kg}" oninput="pv()"></div><div><label for="age">Godine</label><input id="age" type="text" inputmode="numeric" value="${d.age}" oninput="pv()"></div></div>
  <div class="card"><label for="st">Datum početka (za brojanje tjedana)</label><input id="st" type="date" value="${d.start}" oninput="pv()"></div>
  <div id="pv" class="card"></div><div id="er" class="err"></div>
  <button onclick="submitForm(${edit})">${edit?'Spremi i preračunaj':'Počni'}</button>${edit?'<p></p><button class="ter" onclick="draft=null;render()">Odustani</button>':''}`}
function pick(p){syncDraft();draft.p=p;render()}
function syncDraft(){if(!$('#cm'))return;draft={p:draft.p,cm:$('#cm').value,kg:$('#kg').value,age:$('#age').value,start:$('#st').value||today()}}
function valid(){const cm=num($('#cm').value),kg=num($('#kg').value),a=num($('#age').value);return cm>=120&&cm<=230&&kg>=35&&kg<=250&&a>=16&&a<=90?{cm,kg,age:a}:null}
function pv(){syncDraft();const v=valid(),el=$('#pv');if(!el)return;
 if(!v){el.innerHTML='<span class="mu">Unesite visinu (120–230 cm), težinu (35–250 kg) i godine (16–90).</span>';return}
 const T=calc(draft.p,v.cm,v.kg,v.age,D&&draft.p===cur?D.adj:0);el.innerHTML=`<div class="lab">Dnevni cilj</div><div class="big">${T.kcal} kcal</div><div class="lab">Proteini ${T.prot} g · Ugljikohidrati ${T.carb} g · Masti ${T.fat} g</div>`}
function submitForm(edit){syncDraft();const v=valid();if(!v){$('#er').textContent='Provjerite unesene vrijednosti.';return}
 if(!edit){cur=draft.p;D={cm:v.cm,kg:v.kg,age:v.age,start:draft.start,w0:v.kg,addTrain:false,created:true};LS.set(K+'last',cur)}
